steps:
  # Step 1: Build and tag the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_IMAGE_NAME}:${COMMIT_SHA}'
      - '.'

  # Step 2: Push the Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_IMAGE_NAME}:${COMMIT_SHA}'

  # Step 3: Deploy to Cloud Run with Cloud SQL connection and VPC access
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - run
      - deploy
      - ${_CLOUD_RUN_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_IMAGE_NAME}:${COMMIT_SHA}
      - --platform=managed
      - --region=${_REGION}
      - --port=5000
      - --allow-unauthenticated
      - --vpc-connector=${_VPC_CONNECTOR}
      - --vpc-egress=all
      - --add-cloudsql-instances=${_SQL_INSTANCE_CONNECTION_NAME}
      - --set-secrets=DB_PASSWORD=db_password:latest
      - --set-env-vars=INSTANCE_CONNECTION_NAME=${_SQL_INSTANCE_CONNECTION_NAME}
      - --service-account=venkat-cloud@${PROJECT_ID}.iam.gserviceaccount.com

substitutions:
  _REGION: us-central1
  _ARTIFACT_REPO: flask-app-repo
  _IMAGE_NAME: flask-food-site
  _CLOUD_RUN_SERVICE: flask-app
  _SQL_INSTANCE_CONNECTION_NAME: solid-alignment-466215-b7:us-central1:food-site-db
  _VPC_CONNECTOR: flask

options:
  logging: CLOUD_LOGGING_ONLY
